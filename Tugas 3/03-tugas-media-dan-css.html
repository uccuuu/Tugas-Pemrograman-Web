<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah Responsif</title>
    <link rel="stylesheet" href="03-tugas-style.css">
</head>

<body>

    <main class="page">

        <header class="page__header">

            <h1 class="page__title">
                Pemutar Media Kuliah Responsif
            </h1>

            <p class="page__subtitle">
                Media pembelajaran digital untuk mata kuliah Pemrograman Website
            </p>

        </header>

        <article class="media-card">

            <picture class="media-card__picture">

                <source
                    media="(min-width: 800px)"
                    srcset="assets/images/kuliah-large.webp"
                    type="image/webp"
                >

                <source
                    media="(max-width: 799px)"
                    srcset="assets/images/kuliah-small.webp"
                    type="image/webp"
                >

                <img
                    class="media-card__image"
                    src="assets/images/kuliah-fallback.jpg"
                    alt="Ilustrasi mahasiswa mengikuti pembelajaran pemrograman website"
                    loading="lazy"
                >

            </picture>

            <div class="media-card__content">

                <h2 class="media-card__title">
                    Rekayasa Media Digital dan Dasar-Dasar CSS
                </h2>

                <p class="media-card__description">
                    Materi pembelajaran mengenai penggunaan media digital
                    HTML5 dan dasar-dasar CSS.
                </p>

            </div>

        </article>

    </main>

</body>

</html>
